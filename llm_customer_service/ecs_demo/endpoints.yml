# -*- coding: utf-8 -*-
# 端点配置文件

# LLM模型配置
# 说明: 硅基流动(SiliconFlow)提供 OpenAI 兼容接口, 因此使用 type: openai + api_base
#      如需改回阿里云百炼(DashScope), 把 type 改成 qwen、model 改成 qwen-plus 即可
models:
  default:
    type: openai
    model: ${LLM_MODEL:Qwen/Qwen3-30B-A3B-Instruct-2507}
    api_key: ${SILICONFLOW_API_KEY}
    api_base: ${LLM_API_BASE:https://api.siliconflow.cn/v1}
    temperature: 0.1
    max_tokens: 2048
    timeout: 60

# 向量存储配置 (Neo4j)
vector_store:
  uri: bolt://localhost:7687
  user: neo4j
  password: ${NEO4J_PASSWORD}

# 数据库配置 (MySQL)
database:
  url: mysql+pymysql://root:${MYSQL_PASSWORD}@localhost:3306/ecommerce

# Tracker存储配置
tracker_store:
  type: memory

# NLG配置
nlg:
  rephrase_enabled: false
